---
# CVAT VPS Configuration
# Override these values for production deployment

# Domain/IP for CVAT access
# Options: cvat.feigl.dev or cvat.182bit.dev
cvat_host: cvat.feigl.dev

# Port (default: 8080)
cvat_port: 8080

# Admin credentials - CHANGE THESE!
# Generate secure passwords with: openssl rand -base64 32
cvat_admin_password: "ChangeMeInProduction123!"  # TODO: Generate secure password
cvat_admin_email: admin@feigl.dev

# Database credentials
cvat_db_password: "SecureDbPass456!"  # TODO: Generate secure password
cvat_db_name: cvat
cvat_db_user: root

# Redis credentials
cvat_redis_password: "SecureRedisPass789!"  # TODO: Generate secure password

# Installation directory on VPS
cvat_install_dir: /opt/cvat

# CVAT version (master = latest)
cvat_version: master

