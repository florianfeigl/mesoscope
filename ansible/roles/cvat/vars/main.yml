---
# CVAT deployment defaults
cvat_install_dir: /opt/cvat
cvat_user: cvat
cvat_version: master
cvat_port: 8080

# Security: These MUST be provided via Ansible Vault (group_vars/vault.yml).
# Left empty on purpose so a missing vault value fails loudly instead of
# silently deploying a known default. See the assert in tasks/main.yml.
cvat_admin_password: ""
cvat_db_password: ""
cvat_redis_password: ""

# Optional
cvat_host: localhost
cvat_admin_email: admin@localhost
cvat_db_name: cvat
cvat_db_user: root
