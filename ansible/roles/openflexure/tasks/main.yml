---
- name: Install OpenFlexure dependencies
  apt:
    name:
      - python3-pip
      - python3-venv
      - python3-scipy
      - python3-matplotlib
      - python3-yaml
      - git
      - libjpeg-dev
      - zlib1g-dev
      - libcap-dev
    state: present

- name: Create OpenFlexure directory
  file:
    path: /opt/openflexure
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0755'

- name: Clone OpenFlexure Server repository (v3 branch)
  git:
    repo: 'https://gitlab.com/openflexure/openflexure-microscope-server.git'
    dest: /opt/openflexure/server
    version: v3
    update: yes
    force: yes

- name: Check if venv has system-site-packages enabled
  stat:
    path: /opt/openflexure/venv/lib/python3.13/no-global-site-packages.txt
  register: no_system_packages

- name: Remove venv if system-site-packages is not enabled
  file:
    path: /opt/openflexure/venv
    state: absent
  when: no_system_packages.stat.exists

- name: Set up Python virtual environment for OpenFlexure
  command: python3 -m venv --system-site-packages /opt/openflexure/venv
  args:
    creates: /opt/openflexure/venv

- name: Check if web app static files exist
  stat:
    path: /opt/openflexure/server/src/openflexure_microscope_server/static
  register: static_dir

- name: Download web app build artifacts from GitLab CI
  get_url:
    url: "https://gitlab.com/api/v4/projects/9238334/jobs/artifacts/v3/download?job=build"
    dest: /tmp/openflexure-webapp.zip
    mode: '0644'
  when: not static_dir.stat.exists

- name: Extract web app static files
  unarchive:
    src: /tmp/openflexure-webapp.zip
    dest: /opt/openflexure/server
    remote_src: yes
  when: not static_dir.stat.exists

- name: Clean up web app archive
  file:
    path: /tmp/openflexure-webapp.zip
    state: absent

- name: Install OpenFlexure Server package (editable)
  command: /opt/openflexure/venv/bin/pip install -e ".[pi]"
  args:
    chdir: /opt/openflexure/server

- name: Apply Pi 5 pisp ISP compatibility patch
  script: files/patch_rpi5_pisp.sh
  args:
    chdir: /opt/openflexure/server
  register: pisp_patch
  changed_when: "'Patched' in pisp_patch.stdout"
  notify: restart_openflexure

- name: Find installed openflexure_microscope_server package path
  command: /opt/openflexure/venv/bin/python3 -c "import openflexure_microscope_server, os; print(os.path.dirname(openflexure_microscope_server.__file__))"
  register: ofm_package_path
  changed_when: false

- name: Ensure fallback template exists
  copy:
    content: |
      <html><head><title>OpenFlexure - Error</title></head>
      <body><h1>OpenFlexure Microscope Server</h1>
      <p>The server encountered an error during startup:</p>
      <pre>{{ "{{ error }}" }}</pre>
      </body></html>
    dest: "{{ ofm_package_path.stdout }}/server/fallback.html.jinja"
    mode: '0644'
    force: no

- name: Create OpenFlexure data directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0755'
  loop:
    - /var/openflexure
    - /var/openflexure/settings
    - /var/openflexure/logs
    - /var/openflexure/data

- name: Deploy OpenFlexure configuration
  template:
    src: ofm_config.json.j2
    dest: /var/openflexure/settings/ofm_config.json
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0644'
  notify: restart_openflexure

- name: Create systemd service for OpenFlexure
  template:
    src: openflexure.service.j2
    dest: /etc/systemd/system/openflexure.service
    mode: '0644'
  notify: restart_openflexure
