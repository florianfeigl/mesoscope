all:
  children:
    # Raspberry Pi 5 - Microscope Control
    rpi5:
      hosts:
        mesoscope:
          # Use IP address if mDNS (mesoscope.local) does not resolve.
          # Requires avahi-daemon running on both client and target.
          #ansible_host: mesoscope.local
          ansible_host: 192.168.178.77
          ansible_user: lab
          ansible_ssh_private_key_file: ~/.ssh/prototype
      vars:
        ansible_python_interpreter: /usr/bin/python3

    # VPS - CVAT Annotation Server
    vps:
      hosts:
        cvat-server:
          ansible_host: 152.53.16.72
          ansible_user: florian
          # Update this path to your werkbank SSH key
          ansible_ssh_private_key_file: ~/.ssh/werkbank
      vars:
        # CVAT Configuration - Use Ansible Vault in production!
        # See group_vars/vault.yml
        cvat_host: cvat.feigl.dev
        cvat_port: 8080
